<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graphene PA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Graphene PA</span>
    </div>
    <button class="icon-btn" type="button" id="hub-trigger" aria-label="Menu"
            aria-haspopup="menu" aria-expanded="false" aria-controls="hub">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="view" id="view-chat">
    <div class="chat-log">

      <div class="msg msg-assistant">
        <div class="bubble">Good morning. You have 3 tasks today and one reminder at 2:00 PM.</div>
        <span class="msg-time">9:02 AM</span>
      </div>

      <div class="msg msg-user">
        <div class="bubble">What's the reminder?</div>
        <span class="msg-time">9:02 AM</span>
      </div>

      <div class="msg msg-assistant">
        <div class="bubble">Call the pharmacy about your prescription refill.</div>
        <span class="msg-time">9:03 AM</span>
      </div>

    </div>
  </main>

  <form class="composer" id="composer">
    <button class="icon-btn" type="button" aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <input class="composer-input" type="text" placeholder="Ask your assistant…" aria-label="Message">
    <button class="send-btn" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12 20 4l-6 16-3-7-7-1Z" fill="currentColor"/></svg>
    </button>
  </form>

  <nav class="tab-bar" aria-label="Primary">
    <button class="tab-btn is-active" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H8l-4 4V5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Chat</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="m4 12 4 4 12-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Tasks</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Schedule</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <!-- ---- radial hub menu --------------------------------------------------
       Circular menu floating over the chat view. Items are placed around the
       ring by the --angle on each .hub-item; the glow behind the ring rotates
       to --active-angle so it always sits behind the current item.
       -------------------------------------------------------------------- -->
  <div class="hub" id="hub" role="menu" aria-label="Menu" hidden style="--active-angle: 0deg">

    <span class="hub-glow" aria-hidden="true"></span>

    <ul class="hub-ring">

      <li class="hub-item" style="--angle: 0deg">
        <button class="hub-btn is-active" type="button" role="menuitem" aria-current="page">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="hub-label">Home</span>
        </button>
      </li>

      <li class="hub-item" style="--angle: 60deg">
        <button class="hub-btn" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m15.8 15.8 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="hub-label">Search</span>
        </button>
      </li>

      <li class="hub-item" style="--angle: 120deg">
        <button class="hub-btn" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="m12 4.6 2.4 4.9 5.4.8-3.9 3.8.9 5.3-4.8-2.5-4.8 2.5.9-5.3L4.2 10.3l5.4-.8L12 4.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="hub-label">Favourites</span>
        </button>
      </li>

      <li class="hub-item" style="--angle: 180deg">
        <button class="hub-btn" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="12" cy="5.4" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="18.6" r="1.5" fill="currentColor"/></svg>
          <span class="hub-label">More</span>
        </button>
      </li>

      <li class="hub-item" style="--angle: 240deg">
        <button class="hub-btn" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.6-5.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M19.6 3.6v3.9h-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hub-label">Refresh</span>
        </button>
      </li>

      <li class="hub-item" style="--angle: 300deg">
        <button class="hub-btn" type="button" role="menuitem">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M20 12H4.6M10.4 6.2 4.6 12l5.8 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hub-label">Back</span>
        </button>
      </li>

    </ul>

    <button class="hub-core" type="button" id="hub-core" role="menuitem">
      <span class="hub-core-inner" aria-hidden="true">
        <span class="hub-core-pill"></span>
      </span>
      <span class="hub-label hub-label-core">Ask</span>
    </button>

  </div>

</div>
<script src="app.js"></script>
</body>
</html>
