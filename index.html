<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graphene PA</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<div class="lock" id="lock" role="dialog" aria-modal="true"
     aria-labelledby="lock-title" aria-describedby="lock-hint">
  <div class="lock-inner">
    <span class="brand-mark lock-mark" aria-hidden="true"></span>
    <h1 class="lock-title" id="lock-title">Enter PIN</h1>
    <p class="lock-hint" id="lock-hint">Unlock Graphene PA</p>
    <div class="pin-dots" id="pin-dots" aria-hidden="true"></div>
    <p class="lock-error" id="lock-error" role="alert" aria-live="assertive"></p>
    <div class="keypad" id="keypad">
      <button class="key" type="button" data-key="1">1</button>
      <button class="key" type="button" data-key="2">2</button>
      <button class="key" type="button" data-key="3">3</button>
      <button class="key" type="button" data-key="4">4</button>
      <button class="key" type="button" data-key="5">5</button>
      <button class="key" type="button" data-key="6">6</button>
      <button class="key" type="button" data-key="7">7</button>
      <button class="key" type="button" data-key="8">8</button>
      <button class="key" type="button" data-key="9">9</button>
      <button class="key key-action" type="button" data-key="del" aria-label="Delete">⌫</button>
      <button class="key" type="button" data-key="0">0</button>
      <button class="key key-action key-ok" type="button" data-key="ok" aria-label="Confirm">✓</button>
    </div>
    <noscript><p class="lock-hint">JavaScript is required to unlock.</p></noscript>
  </div>
</div>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Graphene PA</span>
    </div>
    <button class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 13a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 6.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6a1.7 1.7 0 0 0 1-1.55V1a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 8a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main class="view" id="view-chat">
    <div class="chat-log">

      <div class="msg msg-assistant">
        <div class="bubble">Good morning. You have 3 tasks today and one reminder at 2:00 PM.</div>
        <span class="msg-time">9:02 AM</span>
      </div>

      <div class="msg msg-user">
        <div class="bubble">What's the reminder?</div>
        <span class="msg-time">9:02 AM</span>
      </div>

      <div class="msg msg-assistant">
        <div class="bubble">Call the pharmacy about your prescription refill.</div>
        <span class="msg-time">9:03 AM</span>
      </div>

    </div>
  </main>

  <form class="composer" id="composer">
    <button class="icon-btn" type="button" aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <input class="composer-input" type="text" placeholder="Ask your assistant…" aria-label="Message">
    <button class="send-btn" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12 20 4l-6 16-3-7-7-1Z" fill="currentColor"/></svg>
    </button>
  </form>

  <nav class="tab-bar" aria-label="Primary">
    <button class="tab-btn is-active" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H8l-4 4V5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Chat</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="m4 12 4 4 12-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Tasks</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Schedule</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </button>
  </nav>

</div>
</body>
</html>
