<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graphene PA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Graphene PA</span>
    </div>
    <button class="icon-btn" type="button" id="rail-trigger" aria-label="Menu"
            aria-haspopup="menu" aria-expanded="false" aria-controls="rail">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </header>

  <!-- ---- floating menu rail -----------------------------------------------
       Detached vertical bar on the left edge. Non-modal: the app stays
       visible and interactive behind it, and tapping anywhere outside
       dismisses it. app.js toggles [data-open] on .rail.
       -------------------------------------------------------------------- -->
  <nav class="rail" id="rail" aria-label="Menu" hidden>
    <ul class="rail-list">

      <li class="rail-item">
        <button class="rail-btn is-active" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="rail-label">Chat</span>
        </button>
      </li>

      <li class="rail-item">
        <button class="rail-btn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m4 12 4 4 12-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="rail-label">Tasks</span>
        </button>
      </li>

      <li class="rail-item">
        <button class="rail-btn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="rail-label">Schedule</span>
        </button>
      </li>

      <li class="rail-item">
        <button class="rail-btn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="rail-label">Profile</span>
        </button>
      </li>

      <li class="rail-sep" role="separator"></li>

      <li class="rail-item">
        <button class="rail-btn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.6v2.2M12 18.2v2.2M20.4 12h-2.2M5.8 12H3.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6M17.9 17.9l-1.6-1.6M7.7 7.7 6.1 6.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="rail-label">Settings</span>
        </button>
      </li>

    </ul>
  </nav>

  <main class="view" id="view-chat">
    <div class="chat-log">

      <div class="msg msg-assistant">
        <div class="bubble">Good morning. You have 3 tasks today and one reminder at 2:00 PM.</div>
        <span class="msg-time">9:02 AM</span>
      </div>

      <div class="msg msg-user">
        <div class="bubble">What's the reminder?</div>
        <span class="msg-time">9:02 AM</span>
      </div>

      <div class="msg msg-assistant">
        <div class="bubble">Call the pharmacy about your prescription refill.</div>
        <span class="msg-time">9:03 AM</span>
      </div>

    </div>
  </main>

  <form class="composer" id="composer">
    <button class="icon-btn" type="button" aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <input class="composer-input" type="text" placeholder="Ask your assistant…" aria-label="Message">
    <button class="send-btn" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12 20 4l-6 16-3-7-7-1Z" fill="currentColor"/></svg>
    </button>
  </form>

  <nav class="tab-bar" aria-label="Primary">
    <button class="tab-btn is-active" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v11H8l-4 4V5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Chat</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="m4 12 4 4 12-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Tasks</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Schedule</span>
    </button>
    <button class="tab-btn" type="button">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </button>
  </nav>

</div>
<script src="app.js"></script>
</body>
</html>
